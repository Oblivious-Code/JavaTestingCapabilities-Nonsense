<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DoShibu Browser — Private Search & AI</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --muted: #767676;
      --nav-link: #555555;
      --surface: #ffffff;
      --border: #dedede;
      --border-focus: #bbbbbb;
      --switch-bg: #f3f3f3;
      --active-tab: #ffffff;
      --dropdown-hover: #f5f5f5;
      --pill-bg: #f8f8f8;
      --shadow: 0 3px 14px rgba(0, 0, 0, 0.05);
      --shadow-focus: 0 5px 20px rgba(0, 0, 0, 0.09);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body.dark {
      --bg: #18181b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --nav-link: #d4d4d8;
      --surface: #27272a;
      --border: #3f3f46;
      --border-focus: #52525b;
      --switch-bg: #18181b;
      --active-tab: #3f3f46;
      --dropdown-hover: #3f3f46;
      --pill-bg: #222225;
      --shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
      --shadow-focus: 0 5px 20px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 26px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .top-nav > a {
      color: var(--nav-link);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 4px;
    }

    .top-nav > a:hover { color: #de5833; }

    .menu-wrapper {
      position: relative;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--nav-link);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .menu-button:hover {
      border-color: var(--border-focus);
    }

    .dropdown-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px;
      box-shadow: var(--shadow-focus);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dropdown-menu[hidden] {
      display: none;
    }

    .dropdown-menu button,
    .dropdown-menu a {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dropdown-menu button:hover,
    .dropdown-menu a:hover {
      background: var(--dropdown-hover);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 6px;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20vh 20px 100px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      color: #de5833;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #de5833;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(222, 88, 51, 0.28);
    }

    .search-box {
      width: min(100%, 660px);
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 7px 6px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-focus);
    }

    .search-icon {
      color: var(--muted);
      font-size: 20px;
      user-select: none;
    }

    .search-box input {
      flex: 1;
      min-width: 50px;
      height: 44px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-box input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .clear-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .clear-btn:hover {
      background: var(--dropdown-hover);
      color: var(--text);
    }

    .clear-btn[hidden] {
      display: none;
    }

    .mode-switch {
      display: flex;
      flex-shrink: 0;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--switch-bg);
    }

    .mode-switch button {
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--nav-link);
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .mode-switch button.active {
      background: var(--active-tab);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    .mode-switch button.ai.active {
      color: #de5833;
    }

    .mobile-go-btn {
      display: none;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: #de5833;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
    }

    .mobile-go-btn:active {
      transform: scale(0.95);
    }

    .app-shortcut {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, transform 0.15s;
    }

    .app-shortcut:hover {
      border-color: #de5833;
    }

    .app-shortcut:active {
      transform: scale(0.97);
    }

    .app-shortcut-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #de5833;
      flex-shrink: 0;
    }

    .app-shortcut-arrow {
      color: var(--muted);
      font-size: 12px;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    kbd {
      padding: 2px 6px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--nav-link);
    }

    @media (max-width: 600px) {
      main {
        padding-top: 15vh;
        padding-bottom: calc(92px + env(safe-area-inset-bottom));
      }

      .top-nav {
        top: 14px;
        right: 16px;
        gap: 10px;
      }

      .top-nav > a {
        display: none;
      }

      .logo-badge {
        width: 40px;
        height: 40px;
      }

      .search-box {
        padding: 6px 6px 6px 16px;
        border-radius: 18px;
      }

      .mobile-go-btn {
        display: flex;
      }

      .mode-switch {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: min(calc(100% - 32px), 380px);
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow-focus);
        z-index: 20;
      }

      .mode-switch button {
        flex: 1;
        min-height: 46px;
        font-size: 14px;
        border-radius: 13px;
      }

      .mode-switch button.active {
        background: var(--switch-bg);
      }

      .desktop-keys {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav class="top-nav" aria-label="Site navigation">
    <a href="https://duckduckgo.com" target="_blank" rel="noopener">About</a>
    <div class="menu-wrapper">
      <button type="button" class="menu-button" id="menuButton" aria-label="Menu" aria-expanded="false">☰</button>
      <div class="dropdown-menu" id="dropdownMenu" hidden>
        <button type="button" id="themeToggle">
          <span>Dark Mode</span>
          <span id="themeIcon">🌙</span>
        </button>
        <div class="dropdown-divider"></div>
        <a href="https://duckduckgo.com" target="_blank" rel="noopener">Download DuckDuckGo</a>

  <!-- Main content area containing branding, search form, and app shortcut -->
  <main>
    <div class="brand">
      <div class="logo-badge" aria-hidden="true">
        <!-- SVG Logo -->
      </div>
      <span>DoShibu Browser</span>
    </div>

    <form class="search-box" id="searchForm">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="query" type="search" placeholder="Search the web" aria-label="Search or ask a question" autocomplete="off">
      <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search" hidden>✕</button>
      <button type="submit" class="mobile-go-btn" aria-label="Submit search">→</button>
      <div class="mode-switch" aria-label="Choose search mode">
        <button class="active" type="button" id="searchMode">Search</button>
        <button class="ai" type="button" id="aiMode">✦ Ask AI</button>
      </div>
    </form>

    <a class="app-shortcut" href="https://duckduckgo.com" target="_blank" rel="noopener">
      <span class="app-shortcut-dot" aria-hidden="true"></span>
      <span>Get the DuckDuckGo App</span>
      <span class="app-shortcut-arrow" aria-hidden="true">↗</span>
    </a>

    <p class="hint" id="hint">
      Private search, less tracking.<span class="desktop-keys"> Press <kbd>/</kbd> to search or <kbd>Alt</kbd>+<kbd>A</kbd> to switch modes.</span>
    </p>
  </main>

</body>
</html>
